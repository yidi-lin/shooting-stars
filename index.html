<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shooting Stars</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04070e; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { cursor: none; }
  #msg { position: fixed; inset: 0; margin: auto; height: 1.4em; text-align: center; color: #9fb3d9; font: 15px/1.4 system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<p id="msg"></p>
<script>
'use strict';
const glc = document.getElementById('gl');
const ui = document.getElementById('ui');
const cx = ui.getContext('2d');
const gl = glc.getContext('webgl2', { antialias: true, depth: true, alpha: false, premultipliedAlpha: true });
if (!gl) { document.getElementById('msg').textContent = 'This needs WebGL2.'; throw new Error('no webgl2'); }

const TAU = Math.PI * 2, rnd = Math.random;
const pick = a => a[(rnd() * a.length) | 0];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---------------- dunes (shared with the shader) ---------------- */
// four ranges of sand dunes, far to near: sharp crests, broad troughs
const ridge = (u, f, ph) => { const x = u * f + ph; const v = .5 + .5 * Math.sin(x + .75 * Math.sin(x)); return Math.pow(v, 1.4) * (.75 + .25 * Math.sin(x * .37 + ph * 2)); };
const duneH = (i, u) =>
  i === 0 ? .112 + .03 * ridge(u, 15, 1.3) * (.7 + .3 * Math.sin(u * 3.1 + .4)) :
  i === 1 ? .086 + .056 * ridge(u, 8.5, 4.1) * (.65 + .35 * Math.sin(u * 2.3 + 2)) :
  i === 2 ? .05 + .072 * ridge(u, 5.2, 2.2) * (.6 + .4 * Math.sin(u * 1.7 + 5)) :
            .008 + .082 * ridge(u, 3.1, .7) * (.7 + .3 * Math.sin(u * 1.3 + 1));
const duneTop = u => Math.max(duneH(0, u), duneH(1, u), duneH(2, u), duneH(3, u));
const GLSL_DUNES = `
float ridge(float u,float f,float ph){ float x=u*f+ph; float v=.5+.5*sin(x+.75*sin(x)); return pow(v,1.4)*(.75+.25*sin(x*.37+ph*2.)); }
float duneH(int i,float u){
  if(i==0) return .112+.03*ridge(u,15.,1.3)*(.7+.3*sin(u*3.1+.4));
  if(i==1) return .086+.056*ridge(u,8.5,4.1)*(.65+.35*sin(u*2.3+2.));
  if(i==2) return .05+.072*ridge(u,5.2,2.2)*(.6+.4*sin(u*1.7+5.));
  return .008+.082*ridge(u,3.1,.7)*(.7+.3*sin(u*1.3+1.));
}
`;
const GLSL_COMMON = `
vec3 hue(float h){ return .5+.5*cos(6.2832*(h+vec3(0.,.33,.67))); }
float h12(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h12(i),h12(i+vec2(1,0)),f.x), mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x), f.y); }
`;

/* ---------------- GL helpers ---------------- */
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name.replace('[0]', ''); u[nm] = gl.getUniformLocation(p, nm); }
  p.u = u; return p;
}
const QUAD_VS_HEAD = `vec2 c=vec2((gl_VertexID&1)==0?-1.:1., (gl_VertexID&2)==0?-1.:1.);`;

/* ---------------- sky + dunes ---------------- */
const skyProg = prog(`#version 300 es
void main(){ vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2); gl_Position=vec4(p*2.-1.,0,1); }`,
`#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uDpr, uTime; uniform int uMode;
uniform vec4 uL[4]; uniform vec3 uLC[4];
out vec4 o;
${GLSL_DUNES}
${GLSL_COMMON}
vec2 h22(vec2 p){ float a=h12(p); return vec2(a,h12(p+a*17.3)); }
vec3 lights(vec2 q, float k){
  vec3 c=vec3(0);
  for(int i=0;i<4;i++){ vec2 d=q-uL[i].xy; c+=uLC[i]*uL[i].w*exp(-dot(d,d)/(uL[i].z*uL[i].z*k)); }
  return c;
}
vec3 duneCol(int i, float u, float yb){
  float fi=float(i)/3.;                         // 0 far .. 1 near
  float h=duneH(i,u)*uRes.y;
  float dep=(h-yb)/uRes.y;
  // the light/shadow line runs from the crest diagonally down the face
  float us=u+dep*(.35+.25*fi)*uRes.y/uRes.x, e=.0015;
  float sl=(duneH(i,us+e)-duneH(i,us-e))/(2.*e)*uRes.y/uRes.x;
  float lam=smoothstep(-.22,.28,-sl);
  vec3 lit=mix(vec3(.3,.4,.6),vec3(.64,.7,.83),fi), shd=mix(vec3(.15,.23,.42),vec3(.2,.26,.42),fi);
  vec3 c=mix(shd,lit,lam);
  c*=mix(1.,.8,smoothstep(0.,.1,dep));
  c*=.82+.28*u;                                  // horizon glow on the right
  // wind ripples on the sunlit faces, finer in the distance
  float rp=sin((yb*(1.4-fi*.7)+14.*sin(u*(30.-fi*14.)+float(i)*2.)+u*uRes.x*.12));
  c*=1.+rp*.02*lam*fi*fi;
  c+=vec3(.12,.15,.22)*exp(-(h-yb)*(1.2-fi*.6))*lam*.5;    // soft rim along lit crests
  c*=.95+.1*h12(floor(gl_FragCoord.xy));                   // sand grain
  vec3 haze=vec3(.11,.21,.42);
  return mix(c,haze,(1.-fi)*.45);
}
void main(){
  vec2 q=vec2(gl_FragCoord.x/uDpr, uRes.y-gl_FragCoord.y/uDpr);   // css px, y down
  float u=q.x/uRes.x, v=1.-q.y/uRes.y;                               // v: 0 bottom, 1 top
  float dith=(h12(gl_FragCoord.xy)-.5)/255.;
  if(uMode==0){
    vec3 top=vec3(.008,.014,.035), mid=vec3(.025,.06,.14), low=vec3(.08,.18,.38);
    vec3 c=mix(low,mid,smoothstep(.06,.5,v));
    c=mix(c,top,smoothstep(.42,1.,v));
    c+=vec3(.05,.15,.36)*exp(-pow((u-.95)*1.5,2.)-pow(v*3.,2.));
    c+=vec3(.02,.05,.11)*exp(-v*7.);
    float thin=smoothstep(.1,.5,v);           // fewer stars near the ground
    for(int l=0;l<2;l++){
      float cs=l==0?3.2:7.;
      vec2 cell=floor(q/cs); vec2 hh=h22(cell+float(l)*91.);
      if(hh.x<(l==0?.13:.16)*thin){
        vec2 pos=(cell+.15+.7*h22(cell+7.3+float(l)))*cs;
        float d=length(q-pos);
        float b=l==0? .045+.16*pow(h12(cell+3.1),3.) : .08+.38*pow(h12(cell+5.7),4.);
        float tw=.75+.25*sin(uTime*(1.+hh.y*2.)+hh.y*50.);
        c+=mix(vec3(.75,.82,1.),vec3(1.,.92,.8),hh.y)*b*tw*exp(-d*d*(l==0?3.:1.6))*mix(.5,1.,thin);
      }
    }
    c+=lights(q,1.)*.16;
    o=vec4(c+dith,1);
  } else {
    float yb=uRes.y-q.y;
    vec3 c=vec3(0); float a=0., top=0.;
    for(int i=3;i>=0;i--){
      float h=duneH(i,u)*uRes.y; top=max(top,h);
      float ai=clamp(h-yb+.5,0.,1.)*(1.-a);
      if(ai>0.) { c+=duneCol(i,u,yb)*ai; a+=ai; }
    }
    if(a<=0.) discard;
    c+=lights(vec2(q.x,uRes.y-top),4.)*.12*a;
    o=vec4(c+dith*a,a);
  }
}`);

/* ---------------- stars ---------------- */
const starProg = prog(`#version 300 es
layout(location=0) in vec4 aA;   // x,y (0..1), core radius px, magnitude
layout(location=1) in vec4 aB;   // rgb, style + seed
layout(location=2) in float aAlive;
uniform vec2 uRes; uniform float uTime, uZoom, uFlash; uniform int uTarget;
out vec2 vQ; out vec2 vC; out vec3 vCol; out float vSp, vFl, vI, vSeed; flat out int vSt;
void main(){
  ${QUAD_VS_HEAD}
  bool t=gl_InstanceID==uTarget;
  float z=t?uZoom:1., fl=t?uFlash:0.;
  float sz=aA.z*z;
  float sp=smoothstep(.8,1.,aA.w);
  float ext=sz*(3.5+sp*9.+fl*7.)+1.5;
  vec2 p=aA.xy*uRes+c*ext;
  gl_Position=vec4(p/uRes*2.-1.,0,1); gl_Position.y=-gl_Position.y;
  if(aAlive<=0.) gl_Position=vec4(2,2,2,1);
  vQ=c*ext/sz; vC=c;
  int st=int(floor(aB.w)); float s=fract(aB.w);
  float rate=st==11?.45:st==9?.6:1.;
  float tw=1.+.3*sin(uTime*(1.1+s*2.6)*rate+s*61.)*sin(uTime*(.6+s)*rate+s*13.);
  float low=mix(.4,1.,smoothstep(.93,.55,aA.y));   // dimmer near the horizon
  vI=(.28+.72*aA.w)*tw*aAlive*(1.+fl*1.4)*(t?1.15:1.)*low;
  vCol=aB.rgb; vSp=sp; vFl=fl; vSt=st; vSeed=s;
}`,
`#version 300 es
precision highp float;
in vec2 vQ; in vec2 vC; in vec3 vCol; in float vSp, vFl, vI, vSeed; flat in int vSt;
uniform float uTime;
out vec4 o;
${GLSL_COMMON}
float spikes(vec2 q, float len){
  return exp(-abs(q.y)*2.2)*exp(-abs(q.x)*len)+exp(-abs(q.x)*2.2)*exp(-abs(q.y)*len);
}
void main(){
  vec2 q=vQ; float r=length(q);
  float core=exp(-r*r*.8);
  float soft=vSt==9||vSt==4?1.6:1.;
  float halo=exp(-r*.7/soft)*(.06+.2*vSp+.35*vFl)*soft;
  float sp=(vSp*.6+vFl*.9)*(vSt==9?.25:1.);
  float len=.3/(1.+vFl*.6+vSp*.8);
  float s;
  if(vSt==3||vSt==10||vSt==15){             // frost, crystal, snow: six-point
    vec2 a=mat2(.5,.866,-.866,.5)*q, b=mat2(.5,-.866,.866,.5)*q;
    s=(exp(-abs(q.y)*2.4)*exp(-abs(q.x)*len)+exp(-abs(a.y)*2.4)*exp(-abs(a.x)*len)+exp(-abs(b.y)*2.4)*exp(-abs(b.x)*len))*.8;
  } else {
    s=spikes(q,len);
    vec2 dq=mat2(.7071,.7071,-.7071,.7071)*q;
    s+=spikes(dq,len*2.4)*.25*(vSp*.5+vFl)*(vSt==5?2.:1.);
  }
  float edge=1.-smoothstep(.7,1.,max(abs(vC.x),abs(vC.y)));
  float I=(core*1.3+halo+sp*s*.5)*vI*edge;
  vec3 col=vCol;
  if(vSt==10) col=mix(col,hue(atan(q.y,q.x)/6.283+uTime*.1),.25*(vSp+vFl)*(1.-core));
  col=mix(col,vec3(1),core*.55);
  o=vec4(col*I,0);
}`);

/* ---------------- lens (magnified star in the reticle) ---------------- */
const lensProg = prog(`#version 300 es
uniform vec2 uRes, uC; uniform float uR;
out vec2 vUv;
void main(){ ${QUAD_VS_HEAD}
  vec2 p=uC+c*uR; gl_Position=vec4(p/uRes*2.-1.,0,1); gl_Position.y=-gl_Position.y; vUv=c; }`,
`#version 300 es
precision highp float;
in vec2 vUv; uniform int uStyle; uniform vec3 uCol; uniform float uT, uOn, uFl;
out vec4 o;
${GLSL_COMMON}
float rays(vec2 s, float n, float sharp, float len, float off){
  float a=atan(s.y,s.x)+off; float rr=length(s);
  float k=mod(n,2.)>.5? max(cos(a*n),0.) : abs(cos(a*n*.5));
  return pow(k,sharp)*exp(-rr/len);
}
void main(){
  float r=length(vUv);
  if(r>1.) discard;
  float m=mix(.35,1.,uOn);
  vec2 s=vUv/(.5*m);
  float rr=length(s), an=atan(s.y,s.x);
  float core=exp(-rr*rr*16.);
  float glow=exp(-rr*3.)*.35;
  vec3 tint=uCol, c=vec3(0);
  float t=uT;
  if(uStyle==0){        // willow: long soft cross, gold core in a lavender haze
    c=vec3(1.,.85,.55)*(rays(s,4.,60.,.75,0.)*1.1+core)+vec3(.75,.65,1.)*glow*1.6;
  } else if(uStyle==1){ // chrysanthemum: many fine warm rays
    c=vec3(1.,.72,.45)*(rays(s,12.,26.,.42,t*.05)*.8+rays(s,4.,80.,.8,0.)*.7+glow*1.4)+core;
  } else if(uStyle==2||uStyle==17||uStyle==20){ // falling rain in gold / blue / purple
    vec3 rc=uStyle==2?vec3(1.,.8,.45):uStyle==17?vec3(.5,.7,1.):vec3(.75,.5,1.);
    float dr=0.;
    for(int i=0;i<6;i++){ float fi=float(i), x0=(fi-2.5)*.15+.03*sin(fi*7.);
      float ln=exp(-pow((s.x-x0)*28.,2.))*step(0.,s.y)*exp(-s.y*(1.6+fi*.3));
      dr+=ln*(.45+.55*pow(.5+.5*sin(s.y*14.-t*5.+fi*2.),4.)); }
    c=rc*(dr*.9+glow*1.5+rays(s,4.,70.,.6,0.)*.7)+core;
  } else if(uStyle==3){ // frost: sharp six-point
    c=vec3(.7,.85,1.)*(rays(s,6.,90.,.9,0.)*1.2+rays(s,6.,30.,.32,.5236)*.35+glow*1.2)+core;
  } else if(uStyle==4){ // feathers: soft, downy
    float fl=vnoise(s*4.+t*.3)*.5+.5;
    c=vec3(1.,.97,.92)*(glow*2.4*fl+rays(s,4.,20.,.5,0.)*.35+core);
  } else if(uStyle==5){ // confetti: gold cross + pink diagonal
    c=vec3(1.,.85,.5)*rays(s,4.,70.,.8,0.)+vec3(1.,.6,.8)*rays(s,4.,70.,.5,.785)+tint*glow+core;
  } else if(uStyle==6){ // blossom: five soft petals
    float pr=.32+.28*pow(abs(cos(an*2.5+t*.2)),.8);
    c=vec3(1.,.66,.8)*smoothstep(pr,pr-.28,rr)*.75+vec3(1.,.85,.6)*core+glow*vec3(1.,.7,.8);
  } else if(uStyle==7){ // lego: square core, primary colours
    float ch=max(abs(s.x),abs(s.y));
    c=vec3(1.,.35,.25)*exp(-ch*ch*8.)*.9+vec3(1.,.85,.2)*rays(s,4.,80.,.7,0.)+vec3(.3,.55,1.)*rays(s,4.,80.,.35,.785)*.6+core;
  } else if(uStyle==8){ // candy: swirl
    float sw=.5+.5*sin(an*3.-rr*12.+t*2.);
    c=mix(vec3(1.,.55,.8),vec3(1.),sw)*exp(-rr*2.6)*.8+core+vec3(1.,.8,.9)*rays(s,4.,60.,.5,0.)*.4;
  } else if(uStyle==9){ // cloud: fluffy pale haze
    float n=vnoise(s*3.+vec2(t*.25,0.))*.6+vnoise(s*7.-t*.2)*.4;
    c=vec3(.88,.88,1.)*exp(-rr*1.8)*(.35+.9*n)+core*.9;
  } else if(uStyle==10){ // crystal: hexagonal facets, prismatic spikes
    float hx=max(abs(s.x)*.866+abs(s.y)*.5,abs(s.y));
    float facet=.75+.25*sign(sin(an*3.));
    c=vec3(.7,.95,1.)*smoothstep(.34,.3,hx)*facet*.8+hue(an/6.283+t*.1)*rays(s,6.,70.,.85,0.)*.9+core+glow*vec3(.6,.9,1.);
  } else if(uStyle==12){ // saturn: tilted ring
    vec2 rs=mat2(.95,-.31,.31,.95)*s;
    float e=length(vec2(rs.x,rs.y/.28));
    float ring=exp(-pow((e-.62)*8.,2.))*(rs.y>0.||e>.75?1.:.25);
    c=vec3(1.,.85,.6)*(ring*.8+glow*1.3)+core;
  } else if(uStyle==13){ // heart
    vec2 h=vec2(abs(s.x),s.y)*.9+vec2(0.,.45);
    float d=h.y+h.x>1.? length(h-vec2(.25,.75))-.3536 : sqrt(min(dot(h-vec2(0,1),h-vec2(0,1)),dot(h-.5*max(h.x+h.y,0.),h-.5*max(h.x+h.y,0.))))*sign(h.x-h.y);
    c=vec3(1.,.5,.65)*exp(-max(d,0.)*7.)*.7+core;
  } else if(uStyle==14){ // butterflies: two soft fluttering wings
    float fl=.75+.25*sin(t*7.);
    vec2 q=vec2(abs(s.x)/fl,s.y);
    float w=exp(-dot((q-vec2(.3,-.1))/vec2(.26,.3),(q-vec2(.3,-.1))/vec2(.26,.3)))+.7*exp(-dot((q-vec2(.22,.22))/vec2(.17,.17),(q-vec2(.22,.22))/vec2(.17,.17)));
    c=vec3(.65,.78,1.)*w*.7+core;
  } else if(uStyle==15){ // snowflake: six fine arms
    c=vec3(.85,.95,1.)*(rays(s,6.,160.,.8,0.)*1.2+rays(s,6.,50.,.25,.5236)*.35+glow)+core;
  } else if(uStyle==16){ // fireflies: little blinking lights
    c=vec3(.8,1.,.5)*(glow*1.2)+core*vec3(1.,1.,.8);
    for(int i=0;i<5;i++){ float fi=float(i);
      vec2 ps=.48*vec2(cos(t*.5+fi*1.3),sin(t*.7+fi*2.1));
      c+=vec3(.85,1.,.45)*exp(-dot(s-ps,s-ps)*140.)*(.5+.5*sin(t*2.5+fi*1.7)); }
  } else if(uStyle==18){ // galaxy: spiral arms
    float arms=pow(.5+.5*cos(3.*an-rr*7.+t*.4),3.);
    c=mix(vec3(.6,.5,1.),vec3(1.,.7,.9),rr)*arms*exp(-rr*2.)*.9+core+glow*vec3(.7,.6,1.);
  } else if(uStyle==19){ // crackle: flickering sparks
    c=vec3(1.,.9,.6)*glow+core;
    float ft=floor(t*9.);
    for(int i=0;i<7;i++){ float fi=float(i);
      vec2 ps=(vec2(h12(vec2(fi,ft)),h12(vec2(ft,fi+3.)))-.5)*1.3;
      c+=vec3(1.,.95,.8)*exp(-dot(s-ps,s-ps)*220.)*step(.4,h12(vec2(fi*7.,ft))); }
  } else {              // water: ripples
    float rp=(.5+.5*sin(rr*20.-t*3.))*exp(-rr*2.4);
    c=vec3(.4,.8,1.)*(rp*.7+glow*1.5)+core+vec3(.7,.9,1.)*rays(s,4.,50.,.45,0.)*.4;
  }
  c*=1.+uFl*1.3;
  float rim=smoothstep(.82,1.,r);
  c+=vec3(.55,.7,1.)*rim*.18;
  c*=uOn*(1.-smoothstep(.92,1.,r));
  float dark=.5*uOn*(1.-smoothstep(.9,1.,r));
  o=vec4(c,dark);
}`);

/* ---------------- particles ---------------- */
const partProg = prog(`#version 300 es
layout(location=0) in vec4 iA;   // x,y,hx,hy (css px)
layout(location=1) in vec4 iB;   // rgb, intensity
layout(location=2) in vec4 iC;   // rot, shape, flip/aspect, seed
uniform vec2 uRes;
out vec2 vUv; out vec4 vCol; flat out float vShape; out float vFlip; out float vSeed;
void main(){
  ${QUAD_VS_HEAD}
  float cs=cos(iC.x), sn=sin(iC.x);
  vec2 o=c*iA.zw; o=vec2(o.x*cs-o.y*sn, o.x*sn+o.y*cs);
  vec2 p=iA.xy+o;
  gl_Position=vec4(p/uRes*2.-1.,0,1); gl_Position.y=-gl_Position.y;
  vUv=c; vCol=iB; vShape=iC.y; vFlip=iC.z; vSeed=iC.w;
}`,
`#version 300 es
precision highp float;
in vec2 vUv; in vec4 vCol; flat in float vShape; in float vFlip; in float vSeed;
out vec4 o;
${GLSL_COMMON}
float sdStar5(vec2 p, float r, float rf){
  const vec2 k1=vec2(.809016994375,-.587785252292);
  const vec2 k2=vec2(-k1.x,k1.y);
  p.x=abs(p.x);
  p-=2.*max(dot(k1,p),0.)*k1;
  p-=2.*max(dot(k2,p),0.)*k2;
  p.x=abs(p.x);
  p.y-=r;
  vec2 ba=rf*vec2(-k1.y,k1.x)-vec2(0,1);
  float h=clamp(dot(p,ba)/dot(ba,ba),0.,r);
  return length(p-ba*h)*sign(p.y*ba.x-p.x*ba.y);
}
void main(){
  vec2 p=vUv; float s=vShape; vec3 c=vCol.rgb; float a=0., g=0.;
  float r=length(p);
  if(s<.5){                      // soft glow dot
    float k=exp(-r*r*30.);
    g=(exp(-r*r*5.)+1.2*k)*(1.-smoothstep(.75,1.,r));
    c=mix(c,vec3(1),k*.6);
  } else if(s<1.5){              // glint: four-point sparkle
    float core=exp(-r*r*45.);
    float sx=exp(-abs(p.y)*26.)*pow(max(1.-abs(p.x),0.),2.);
    float sy=exp(-abs(p.x)*26.)*pow(max(1.-abs(p.y),0.),2.);
    g=core*1.6+(sx+sy)*.95+exp(-r*r*9.)*.3;
    c=mix(c,vec3(1),min(core+(sx+sy)*.25,1.));
  } else if(s<2.5){              // five-point star
    float d=sdStar5(vec2(p.x,-p.y)*1.3,.72,.46)/1.3;
    float fill=1.-smoothstep(-.015,.03,d);
    g=fill*.95+exp(-max(d,0.)*11.)*.5+exp(-r*r*16.)*.7;
    c=mix(c,vec3(1),exp(-r*r*10.)*.85);
  } else if(s<3.5){              // paper confetti
    // rough, slightly torn edges
    float ex=.9+.05*(vnoise(vec2(p.y*9.,vSeed*50.))-.5), ey=.92+.05*(vnoise(vec2(p.x*9.,vSeed*70.))-.5);
    float fill=(1.-smoothstep(ex-.03,ex,abs(p.x)))*(1.-smoothstep(ey-.03,ey,abs(p.y)));
    float grain=vnoise(p*vec2(9.,14.)+vSeed*40.)*.5+vnoise(p*vec2(30.,45.)+vSeed*17.)*.5;
    float fine=h12(floor((p+1.)*vec2(40.,60.))+vSeed*91.);
    float fib=pow(.5+.5*sin(p.y*70.+p.x*12.+vSeed*30.+grain*6.),6.);
    float fold=p.x*.8+p.y*.6+(vSeed-.5)*.8;                     // a soft crease
    float side=vFlip>0.?1.:.72;
    float curl=.14*p.y*sign(vFlip);
    float shd=(.48+.52*abs(vFlip))+curl+(fold>0.?.06:-.06)*abs(vFlip);
    c=c*side*shd*(.8+.2*grain)*(.94+.06*fine)*(1.-.07*fib);
    c*=.9+.1*smoothstep(.0,.04,abs(fold));
    a=fill; g=0.;
  } else if(s<4.5){              // crystal gem (diamond)
    float d=abs(p.x)+abs(p.y);
    float fill=1.-smoothstep(.88,1.,d);
    float facet=(p.x*p.y>0.?.72:1.)*(p.x>0.?1.:.85);
    vec3 ir=hue(vFlip*.3+vSeed+p.x*.3);
    c=mix(c,ir,.35)*facet*(.6+.5*abs(vFlip))+pow(abs(vFlip),12.)*.8;
    a=fill*.45; g=fill*.55+exp(-r*r*5.)*.15+exp(-(1.-d)*28.)*fill*.4;
  } else if(s<5.5){              // cherry petal
    float yy=(p.y+.15)/.85;
    float w=.85*sqrt(max(0.,1.-yy*yy))*mix(1.,.3,smoothstep(-.2,1.,p.y));
    float fill=(1.-smoothstep(w-.1,w,abs(p.x)))*smoothstep(.16,.24,length(p-vec2(0,-1.02)));
    c=mix(c*vec3(1.,.82,.9),c*1.12+.05,smoothstep(.6,-.8,p.y))*(.75+.3*abs(vFlip));
    a=fill*.92; g=fill*.1;
  } else if(s<6.5){              // five-petal blossom
    float an=atan(p.y,p.x)+vSeed*6.283;
    float pr=.48+.45*pow(abs(cos(an*2.5)),.7)-.08*pow(abs(cos(an*2.5)),40.);
    float fill=1.-smoothstep(pr-.07,pr,r);
    float cen=exp(-r*r*45.);
    c=mix(c*1.1+.04,c*vec3(1.,.75,.85),smoothstep(.75,.1,r));
    c=mix(c,vec3(1.,.82,.45),cen);
    a=fill*.94; g=cen*.9+fill*.08;
  } else if(s<7.5){              // feather
    float y=p.y; float x=p.x+.18*(y*y-1.);
    float yy=(y-.08)/.92;
    float w=.82*sqrt(max(0.,1.-yy*yy)); w*=x<0.?.72:1.;
    w*=.9+.1*sin(y*37.+vSeed*20.);
    float fill=(1.-smoothstep(w-.14,w,abs(x)))*smoothstep(-.86,-.8,y);
    float barb=.8+.2*sin(y*30.-abs(x)*20.);
    float shaft=exp(-x*x*700.)*smoothstep(-1.,-.92,y)*(1.-smoothstep(.85,1.,y));
    float down=smoothstep(-.35,-.8,y);
    a=clamp(fill*barb*(1.-.5*down)*.88+shaft*.7,0.,1.);
    c=c*(.72+.28*abs(vFlip))+.08*(1.-abs(x)/max(w,.01));
    g=a*.15;
  } else if(s<8.5){              // streak (velocity-aligned)
    float t=(p.x+1.)*.5;
    float head=exp(-(p.x-.8)*(p.x-.8)*30.-p.y*p.y*12.);
    g=exp(-p.y*p.y*7.)*t*t*(1.-smoothstep(.85,1.,p.x))+head*1.1;
    c=mix(c,vec3(1),head*.6);
  } else if(s<9.5){              // bokeh disc
    float fill=1.-smoothstep(.84,1.,r);
    g=fill*(.4+.35*smoothstep(.5,.95,r));
  } else if(s<10.5){             // falling spark with a rain-like tail
    float asp=max(vFlip,1.);
    float xc=1.-1./asp;
    vec2 h=vec2((p.x-xc)*asp,p.y);
    float core=exp(-dot(h,h)*16.);
    float sp=(exp(-abs(h.y)*14.)*pow(max(1.-abs(h.x),0.),2.)+exp(-abs(h.x)*14.)*pow(max(1.-abs(h.y),0.),2.));
    float tl=clamp((p.x+1.)/(xc+1.),0.,1.)*step(h.x,0.);
    float tail=exp(-h.y*h.y*70.)*pow(tl,1.8)+exp(-h.y*h.y*10.)*pow(tl,2.5)*.12;
    g=core*1.5+sp*.55+tail*.85;
    c=mix(c,vec3(1),core*.7);
  } else if(s<11.5){             // lego brick
    vec2 q=vec2(p.x,-p.y);
    float ns=vSeed<.5?2.:4.;
    float body=step(abs(q.x),.95)*step(-.92,q.y)*step(q.y,.34);
    float top=step(abs(q.x),.95)*step(.34,q.y)*step(q.y,.54);
    float stud=0., studTop=0.;
    for(float i=0.;i<4.;i++){ if(i>=ns) break;
      float cxs=-.95+1.9*(i+.5)/ns, hw=.62*.95/ns;
      float inx=step(abs(q.x-cxs),hw);
      stud=max(stud,inx*step(.5,q.y)*step(q.y,.8));
      studTop=max(studTop,step(length(vec2((q.x-cxs)/hw,(q.y-.8)/.1)),1.));
    }
    float fill=max(max(body,top),max(stud,studTop));
    vec3 col=c*.78;
    col=mix(col,c*1.08,top); col=mix(col,c*.9,stud*(1.-top)); col=mix(col,c*1.18,studTop);
    col+=vec3(.35)*exp(-pow((q.x+.55)*5.,2.))*body*.6;           // glossy highlight
    col*=1.-.35*smoothstep(.85,.95,abs(q.x))*body;
    col*=.8+.25*abs(vFlip);
    c=col; a=fill; g=0.;
  } else if(s<12.5){             // wrapped candy
    float e=length(vec2(p.x/.5,p.y/.82));
    float bodyF=1.-smoothstep(.93,1.,e);
    float ax=abs(p.x);
    float hw=(.18+(ax-.42)*1.25)*(.88+.12*sin(p.y*22.));
    float wrap=step(.42,ax)*step(ax,.98)*step(abs(p.y),hw);
    float stripe=step(0.,sin((p.x+p.y*.6)*14.));
    vec3 bc=mix(c,vec3(1.,.97,.95),stripe*.85);
    bc*=.75+.35*(.5-.5*p.y);
    bc+=vec3(.6)*exp(-dot(p-vec2(-.12,-.38),p-vec2(-.12,-.38))*30.);
    vec3 wc=mix(c,vec3(1.),.55)*(.85+.15*sin(p.y*30.));
    c=mix(wc,bc,bodyF);
    a=max(bodyF,wrap*.82); g=0.;
  } else if(s<13.5){             // peppermint swirl
    float fill=1.-smoothstep(.9,1.,r);
    float an=atan(p.y,p.x);
    float st=step(0.,sin(an*6.+r*5.));
    vec3 col=mix(vec3(1.,.97,.95),c,st);
    col*=.78+.3*(.5-.5*p.y)-.25*smoothstep(.75,.95,r);
    col+=vec3(.55)*exp(-dot(p-vec2(-.3,-.38),p-vec2(-.3,-.38))*25.);
    c=col; a=fill; g=0.;
  } else if(s<14.5){             // jelly bean
    vec2 q=vec2(p.x,p.y+.22*(p.x*p.x-.4));
    float d=length(vec2(max(abs(q.x)-.42,0.)/.58,q.y/.85));
    float fill=1.-smoothstep(.92,1.,d);
    vec3 col=c*(.72+.38*(.5-.5*q.y));
    col+=vec3(.55)*exp(-dot(q-vec2(-.2,-.45),q-vec2(-.2,-.45))*14.);
    c=col; a=fill; g=0.;
  } else if(s<15.5){             // cloud puff
    float n=vnoise(p*2.5+vSeed*20.)*.6+vnoise(p*6.+vSeed*7.)*.4;
    float fill=smoothstep(1.,.15,r+.25*(n-.5));
    c=c*mix(.74,1.06,.5-.5*p.y+.2);
    a=fill*.5; g=fill*.06;
  } else if(s<16.5){             // crystal shard
    float d=max(abs(p.x)/.78,abs(p.y)+abs(p.x)*.55);
    float fill=1.-smoothstep(.9,.98,d);
    float band=p.x<-.28?.62:p.x>.28?1.:.82;
    float tip=step(.62-abs(p.x)*.55,abs(p.y));
    vec3 ir=hue(vFlip*.3+p.y*.25+vSeed);
    c=mix(c,ir,.38)*band*(1.+.2*tip)+vec3(1.)*pow(abs(vFlip),10.)*.7;
    float edge=exp(-(.98-d)*26.)*fill;
    a=fill*.4; g=fill*.55+edge*.6;
  } else if(s<17.5){             // water droplet (velocity-aligned, head forward)
    float asp=max(vFlip,1.);
    vec2 h=vec2(p.x*asp,p.y); float cxh=asp-1.;
    float dc=length(h-vec2(cxh,0.));
    float tw=clamp((h.x+asp)/(cxh+asp),0.,1.);
    float inTail=step(h.x,cxh)*(1.-smoothstep(pow(tw,1.4)*.9,pow(tw,1.4)*.98+.02,abs(h.y)));
    float fill=max(1.-smoothstep(.9,1.,dc),inTail);
    float rim=fill*smoothstep(.55,.98,dc)*step(cxh-.3,h.x);
    float hl=exp(-dot(h-vec2(cxh+.3,-.35),h-vec2(cxh+.3,-.35))*22.);
    c=mix(c,vec3(.92,.98,1.),.35);
    a=fill*.3; g=fill*.22+rim*.6+hl*1.3;
  } else if(s<18.5){             // ripple ring
    g=exp(-pow((r-.82)*10.,2.))*.7*(1.-smoothstep(.95,1.,r));
  } else if(s<19.5){             // butterfly (flaps via quad width)
    vec2 q=vec2(abs(p.x),p.y);
    float up=length((q-vec2(.47,-.24))/vec2(.5,.44));
    float lo=length((q-vec2(.33,.36))/vec2(.33,.32));
    float body=step(q.x,.07)*step(abs(p.y),.62);
    float wing=max(1.-smoothstep(.92,1.,up),1.-smoothstep(.9,1.,lo));
    float fill=max(wing,body);
    float vein=.85+.15*sin(atan(q.y+.1,q.x)*9.);
    vec3 wc=c*vein*mix(1.,.55,smoothstep(.55,1.,min(up,lo)));
    wc+=vec3(.25)*exp(-dot(q-vec2(.55,-.3),q-vec2(.55,-.3))*40.);
    c=mix(wc,c*.25,body)*(.75+.3*abs(vFlip));
    a=fill*.92; g=wing*.18;
  } else if(s<20.5){             // snowflake
    float an=atan(p.y,p.x)+vSeed*6.283, sec=1.0472;
    float a2=mod(an+sec*.5,sec)-sec*.5;
    vec2 q=r*vec2(cos(a2),abs(sin(a2)));
    float arm=exp(-q.y*q.y*700.)*step(q.x,.92);
    vec2 b=q-vec2(.48,0.); float pr=b.x*.5+b.y*.866;
    float br=exp(-pow(b.x*.866-b.y*.5,2.)*700.)*step(0.,pr)*step(pr,.3);
    vec2 b2=q-vec2(.72,0.); float pr2=b2.x*.5+b2.y*.866;
    float br2=exp(-pow(b2.x*.866-b2.y*.5,2.)*700.)*step(0.,pr2)*step(pr2,.17);
    float hex=1.-smoothstep(.12,.16,max(q.x, q.x*.5+q.y*.866));
    g=clamp(arm+br+br2+hex*.8,0.,1.)+exp(-r*r*7.)*.15;
    c=mix(c,vec3(1),.4);
  } else if(s<21.5){             // soap bubble
    float fill=1.-smoothstep(.95,1.,r);
    float rim=smoothstep(.72,.96,r)*fill;
    vec3 film=hue(r*1.4+vFlip*.2+vSeed+p.y*.35);
    float hl=exp(-dot(p-vec2(-.38,-.42),p-vec2(-.38,-.42))*28.);
    c=mix(film,vec3(1),.35);
    a=fill*.06; g=rim*.75+hl*1.1+fill*.04;
  } else if(s<22.5){             // heart
    vec2 h=vec2(abs(p.x),-p.y)*.62+vec2(0.,.5);
    float d;
    if(h.y+h.x>1.) d=length(h-vec2(.25,.75))-.3536;
    else d=sqrt(min(dot(h-vec2(0,1),h-vec2(0,1)),dot(h-.5*max(h.x+h.y,0.),h-.5*max(h.x+h.y,0.))))*sign(h.x-h.y);
    float fill=1.-smoothstep(-.01,.025,d);
    g=fill*.9+exp(-max(d,0.)*12.)*.45;
    c=mix(c,vec3(1),exp(-r*r*8.)*.5);
  } else {                       // (unused)
    g=exp(-pow((r-.82)*10.,2.))*.7*(1.-smoothstep(.95,1.,r));
  }
  float I=vCol.a;
  o=vec4(c*(a+g)*I, min(a*I,1.));
}`);

/* ---------------- bow (real 3D mesh) ---------------- */
const bowProg = prog(`#version 300 es
layout(location=0) in vec3 aP; layout(location=1) in vec3 aN; layout(location=2) in vec3 aC; layout(location=3) in vec2 aM;
uniform vec2 uRes; uniform float uF;
out vec3 vP, vN, vC; out vec2 vM;
void main(){
  vec2 s=vec2(uRes.x*.5+aP.x/aP.z*uF, uRes.y*.5-aP.y/aP.z*uF);
  vec2 ndc=s/uRes*2.-1.; ndc.y=-ndc.y;
  float d=(aP.z-.02)/(300.-.02)*2.-1.;
  gl_Position=vec4(ndc*aP.z, d*aP.z, aP.z);
  vP=aP; vN=aN; vC=aC; vM=aM;
}`,
`#version 300 es
precision highp float;
in vec3 vP, vN, vC; in vec2 vM;
uniform vec3 uFlDir, uFlCol;
out vec4 o;
${GLSL_COMMON}
vec3 lit(vec3 N, vec3 V, vec3 L, vec3 col, float shin, float spec, float wrap){
  float d=max((dot(N,L)+wrap)/(1.+wrap),0.);
  vec3 H=normalize(L+V);
  return col*d + col*0. + vec3(spec)*pow(max(dot(N,H),0.),shin)*step(0.,dot(N,L));
}
void main(){
  int m=int(vM.x+.5);
  vec3 N=normalize(vN), V=normalize(-vP);
  if(dot(N,V)<0. && (m==3)) N=-N;
  vec3 base=vC;
  float shin=24., spec=.18, wrap=.25;
  if(m==0){        // wood: grain along the limb
    float gr=sin(vM.y*140.+sin(vM.y*23.)*3.+vnoise(vec2(vM.y*40.,0.))*4.);
    base*=.85+.15*gr;
  } else if(m==1){ shin=70.; spec=1.1; wrap=0.; }
  else if(m==2){ shin=30.; spec=.25; }
  else if(m==3){ wrap=.6; spec=.05; base*=.92+.08*sin(vM.y*400.); }
  else if(m==4){ shin=60.; spec=.6; }
  else if(m==5){ base*=.85+.15*vnoise(vP.xy*900.); spec=.04; }
  else if(m==6){ float w=vnoise(vec2(vM.y*60.,vP.x*400.+vP.y*400.)); base*=.84+.16*w-.12*smoothstep(.75,.95,vnoise(vP.xy*700.)); spec=.22; shin=30.; }
  vec3 c=vec3(0);
  c+=lit(N,V,normalize(vec3(.25,1.,.45)),base*vec3(.3,.38,.62),shin,spec*.5,wrap);    // sky dome
  c+=lit(N,V,normalize(vec3(-.55,.5,.7)),base*vec3(.55,.6,.78),shin,spec,wrap);      // moonlight, ahead-left
  c+=lit(N,V,normalize(vec3(.1,-1.,.35)),base*vec3(.24,.28,.38),shin,0.,wrap);       // dunes bounce
  c+=lit(N,V,normalize(vec3(.3,.3,-1.)),base*vec3(.3,.31,.38),shin,spec*.4,.5);                // soft fill from behind
  c+=lit(N,V,uFlDir,base*uFlCol,shin,spec*.8,wrap)+uFlCol*spec*.0;                   // firework light
  float rim=pow(1.-max(dot(N,V),0.),3.);
  c+=rim*vec3(.22,.32,.55)*(m==1?1.6:.8);
  if(m==1){ vec3 R=reflect(-V,N); c+=mix(vec3(.02,.04,.09),vec3(.3,.45,.8),smoothstep(-.2,.6,R.y))*.7; }
  o=vec4(c,1);
}`);

/* ---------------- state ---------------- */
let W = 0, H = 0, DPR = 1, F = 800;
let N = 0, starA = null, starMag = null, starStyle = null, alive = null, respawnAt = null;
const dead = [];
const P = [];
const lightsArr = [];
let time = 0;

function setStarColor(i) {
  const m = starMag[i], tint = STYLES[starStyle[i]].tint, k = .2 + .55 * m;
  starA[i * 8 + 4] = lerp(1, tint[0], k); starA[i * 8 + 5] = lerp(1, tint[1], k); starA[i * 8 + 6] = lerp(1, tint[2], k);
}
// give every star a style its neighbours don't have, keeping all styles evenly used
function assignStyles() {
  const K = STYLES.length, asp = innerWidth / innerHeight, cell = .1;
  const gx = Math.ceil(asp / cell) + 1, gy = Math.ceil(1 / cell) + 1;
  const grid = Array.from({ length: gx * gy }, () => []);
  const count = new Float32Array(K);
  const order = [...Array(N).keys()].sort((a, b) => starMag[b] - starMag[a] || rnd() - .5);
  const w = new Float32Array(K);
  for (const i of order) {
    const x = starA[i * 8] * asp, y = starA[i * 8 + 1];
    const cx0 = Math.floor(x / cell), cy0 = Math.floor(y / cell);
    w.fill(0);
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const c = cx0 + dx, r = cy0 + dy;
      if (c < 0 || r < 0 || c >= gx || r >= gy) continue;
      for (const j of grid[r * gx + c]) {
        const d = Math.hypot(starA[j * 8] * asp - x, starA[j * 8 + 1] - y);
        if (d < cell * 1.2) w[starStyle[j]] += (.3 + starMag[j]) / (d + .015);
      }
    }
    let best = 0, bw = 1e9;
    for (let k = 0; k < K; k++) {
      const v = w[k] + count[k] * 40 / N + rnd() * .5;
      if (v < bw) { bw = v; best = k; }
    }
    starStyle[i] = best; count[best]++;
    starA[i * 8 + 7] = best + rnd() * .99;
    setStarColor(i);
    grid[clamp(cy0, 0, gy - 1) * gx + clamp(cx0, 0, gx - 1)].push(i);
  }
}
function makeStars() {

// what happens when a fragment reaches the dunes
function landed(p) {
  if (p.land === L_SPARK) {
    const c = p.col;
    add({ x: p.x, y: p.y, shape: 0, sz: 5 + rnd() * 3, life: .22, gr: 0, col: c, I: .9, fo: 1, fg: 1 });
    for (let k = 0; k < 1 + (rnd() * 2 | 0); k++)
      add({ x: p.x, y: p.y, vx: (rnd() - .5) * 90, vy: -(40 + rnd() * 90), gr: 420, drag: 1, life: .3 + rnd() * .25, shape: 1,
        sz: 1.6 + rnd(), col: c, I: .9, fo: 1.5, fg: 1 });
    if (rnd() < .55) add({ x: p.x + (rnd() - .5) * 4, y: p.y, shape: 1, sz: 2 + rnd() * 1.5, life: .8 + rnd() * 1.6, gr: 0, col: c,
      I: .8, tw: .8, twF: 8 + rnd() * 10, fo: 2, fin: .05, fg: 1 });
    return true;
  }
  if (p.land === L_SPLASH) {
    add({ x: p.x, y: p.y, shape: 18, sz: 3, asp: .3, life: .55, gr: 0, shrink: -5, col: [.6, .85, 1], I: .8, fo: 1.5, fg: 1 });
    for (let k = 0; k < 3 + (rnd() * 3 | 0); k++)
      add({ x: p.x, y: p.y, vx: (rnd() - .5) * 110, vy: -(50 + rnd() * 110), gr: 520, drag: .8, life: .35 + rnd() * .2, shape: 17,
        sz: .9 + rnd() * .7, col: AQUA, I: .9, fo: 1.5, fg: 1 });
    return true;
  }
  if (p.land === L_BOUNCE && p.bn < 2 && p.vy > 60) {
    p.vy = -p.vy * (.28 + .14 * rnd()); p.vx = p.vx * .6 + (rnd() - .5) * 40; p.spin = (rnd() - .5) * 10; p.bn++;
    p.y = p.landY - .1;
    return false;
  }
  // settle on the sand and fade
  p.vx = p.vy = p.wx = 0; p.gr = 0; p.sway = 0; p.spin = 0; p.tumR = 0; p.wob = 0; p.settled = 1; p.y = p.landY;
  p.life = p.age + 1.4 + rnd() * 1.6; p.fo = 2;
  return false;
}

function stepParticles(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.age += dt;
    if (p.age >= p.life || (p.pop && p.age >= p.pop) || p.y > H + 60 || p.x < -200 || p.x > W + 200) {
      if (p.pop && p.age >= p.pop && p.popFn) p.popFn(p.x, p.y);
      P[i] = P[P.length - 1]; P.pop(); continue;
    }
    if (p.settled) continue;
    const k = Math.exp(-p.drag * dt);
    p.vx *= k; p.vy = p.vy * k + p.gr * dt;
    const ph = p.age * p.swayF + p.seed * TAU;
    p.x += (p.vx + p.wx + p.sway * Math.sin(ph)) * dt; p.y += (p.vy + (p.wy || 0) + (p.swy ? p.swy * Math.cos(ph * .73 + 1) : 0)) * dt;
    if (p.wob) { p.rot0 += p.spin * dt; p.rot = p.rot0 + p.wob * Math.cos(ph); }
    else p.rot += p.spin * dt;
    p.tum += p.tumR * dt;
    if (p.trail) {
      p.tAcc += p.trail * dt;
      const env = 1 - Math.pow(p.age / p.life, 2);
      while (p.tAcc >= 1) {
        p.tAcc -= 1;
        if (p.tfn) { p.tfn(p); continue; }
        add({ x: p.x + (rnd() - .5) * 2, y: p.y + (rnd() - .5) * 2, vx: p.vx * .08 + (rnd() - .5) * 8, vy: p.vy * .08 + rnd() * 6,
          drag: 2, gr: 60, life: .5 + rnd() * .9, shape: 0, sz: 1.4 + rnd() * 1.3, col: p.tc, I: .8 * env, tw: .5, twF: 25, fo: 1.5, shrink: .5 });
      }
    }
    if (p.land) {
      if (!p.fg) {
        const hy = horizonY(p.x);
        if (p.y > hy) { p.fg = 1; p.landY = hy + Math.pow(rnd(), 1.7) * (H - hy) * .6 + 2; }
      } else if (p.y >= p.landY && p.vy > 0) {
        if (landed(p)) { P[i] = P[P.length - 1]; P.pop(); }
      }
    }
  }
}

function writeParticles(fgPass, start) {
  let n = start;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    if ((p.fg ? 1 : 0) !== fgPass) continue;
    const t = p.age / p.life;
    let env = (p.fin ? Math.min(1, p.age / p.fin) : 1) * (1 - Math.pow(t, p.fo));
    if (p.tw) env *= 1 - p.tw * (.5 + .5 * Math.sin(p.age * p.twF + p.seed * 50));
    if (env <= .003) continue;
    let hx = p.sz * (1 - t * p.shrink), hy = hx * p.asp, rot = p.rot, fl = 1;
    if (p.tumR || p.settled) { fl = Math.cos(p.tum); hx *= Math.max(Math.abs(fl), .12); }
    const sh = p.shape;
    if (sh === 8 || sh === 10 || sh === 17) {
      const sp = p.settled ? 0 : Math.hypot(p.vx + p.wx, p.vy);
      rot = sp > 1 ? Math.atan2(p.vy, p.vx + p.wx) : Math.PI / 2;
      if (sh === 8) { hy = hx; hx = hx * (1.5 + sp * p.str); }
      else if (sh === 10) { hy = p.sz * 2.4; hx = Math.max(hy, p.sz * (1.5 + sp * p.str)); fl = hx / hy; }
      else { hy = p.sz; hx = p.sz * (1.25 + Math.min(sp * .0018, .7)); fl = hx / hy; }
    }
    const o = n * FL;
    pdata[o] = p.x; pdata[o + 1] = p.y; pdata[o + 2] = hx; pdata[o + 3] = hy;
    pdata[o + 4] = p.col[0]; pdata[o + 5] = p.col[1]; pdata[o + 6] = p.col[2]; pdata[o + 7] = p.I * env;
    pdata[o + 8] = rot; pdata[o + 9] = sh; pdata[o + 10] = fl; pdata[o + 11] = p.seed;
    n++;
  }
  return n;
}

/* ---------------- 3D bow & arrow ---------------- */
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vmul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vnorm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const vlin = (p, a, x, b, y, c, z) => [p[0] + a[0] * x + b[0] * y + c[0] * z, p[1] + a[1] * x + b[1] * y + c[1] * z, p[2] + a[2] * x + b[2] * y + c[2] * z];

function pushV(p, n, c, m, aux) {
  if (bn >= BMAX) return;
  const o = bn * BVF;
  bdata[o] = p[0]; bdata[o + 1] = p[1]; bdata[o + 2] = p[2];
  bdata[o + 3] = n[0]; bdata[o + 4] = n[1]; bdata[o + 5] = n[2];
  bdata[o + 6] = c[0]; bdata[o + 7] = c[1]; bdata[o + 8] = c[2];
  bdata[o + 9] = m; bdata[o + 10] = aux;
  bn++;
}
// swept elliptical tube: C centres, A/B cross-section axes, ra/rb radii, col per point (array of rgb) or one rgb
function tube(C, A, B, ra, rb, col, mat, seg, aux) {
  const rings = [];
  for (let i = 0; i < C.length; i++) {
    const ring = [];
    for (let j = 0; j <= seg; j++) {
      const th = j / seg * TAU, c = Math.cos(th), s = Math.sin(th);
      const p = vlin(C[i], A[i], ra[i] * c, B[i], rb[i] * s, A[i], 0);
      const n = vnorm(vlin([0, 0, 0], A[i], c / Math.max(ra[i], 1e-4), B[i], s / Math.max(rb[i], 1e-4), A[i], 0));
      ring.push([p, n]);
    }
    rings.push(ring);
  }
  const colAt = i => (Array.isArray(col[0]) ? col[i] : col);
  for (let i = 0; i < C.length - 1; i++) {
    const c0 = colAt(i), c1 = colAt(i + 1), u0 = aux ? aux[i] : 0, u1 = aux ? aux[i + 1] : 0;
    for (let j = 0; j < seg; j++) {
      const a = rings[i][j], b = rings[i + 1][j], c = rings[i + 1][j + 1], d = rings[i][j + 1];
      pushV(a[0], a[1], c0, mat, u0); pushV(b[0], b[1], c1, mat, u1); pushV(c[0], c[1], c1, mat, u1);
      pushV(a[0], a[1], c0, mat, u0); pushV(c[0], c[1], c1, mat, u1); pushV(d[0], d[1], c0, mat, u0);
    }
  }
}
function frames(C, n) {   // for each point: A = n (given), B = in-plane perpendicular
  const A = [], B = [];
  for (let i = 0; i < C.length; i++) {
    const T = vnorm(vsub(C[Math.min(i + 1, C.length - 1)], C[Math.max(i - 1, 0)]));
    const Bi = vnorm(vcross(T, n));
    A.push(vnorm(vcross(Bi, T))); B.push(Bi);
  }
  return [A, B];
}
const IVORY = [.86, .84, .78], IVORY_D = [.66, .64, .58], WRAP = [.78, .76, .7], TUFT = [.05, .045, .045];
const STRING = [.9, .89, .85], SHAFT = [.84, .82, .76], STEEL = [.8, .8, .78];
const FEATHER = [.93, .91, .86];
const ARROW_LEN = .62, BRACE = .17, DRAW_LEN = .34;

function buildArrow(Nk, f, up, scale = 1) {
  const side = vnorm(vcross(f, up)), u = vnorm(vcross(side, f));
  const L = ARROW_LEN;
  const P0 = s => vlin(Nk, f, s, u, 0, side, 0);
  const seg = (s0, s1, r0, r1, col, mat, sides = 10, ra = null) => {
    const C = [P0(s0), P0(s1)];
    tube(C, [u, u], [side, side], [ra ? ra[0] : r0, ra ? ra[1] : r1], [r0, r1], col, mat, sides, [s0, s1]);
  };
  seg(-.004, .012, .0042, .0042, IVORY_D, 6);               // nock
  seg(.012, L - .012, .0031, .0031, SHAFT, 6);
  seg(L - .012, L, .0032, .0038, IVORY_D, 6);                // binding
  // leaf-shaped head
  const hC = [P0(L), P0(L + .012), P0(L + .03), P0(L + .052)];
  tube(hC, [u, u, u, u], [side, side, side, side], [.004, .0105, .008, .0003], [.0016, .0022, .0018, .0002], STEEL, 1, 4, [0, 0, 0, 0]);
  // fletching: three vanes
  for (let k = 0; k < 3; k++) {
    const ph = Math.PI / 2 + k * TAU / 3, dir = vlin([0, 0, 0], u, Math.cos(ph), side, Math.sin(ph), f, 0);
    const nrm = vnorm(vcross(f, dir)), col = FEATHER;
    const steps = 9, s0 = .016, s1 = .108;
    let prevB = null, prevE = null;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, s = s0 + (s1 - s0) * t;
      const h = .017 * Math.pow(Math.sin(Math.PI * Math.min(t * 1.15, 1) * .5 + .02), .6) * (1 - Math.pow(t, 2.2)) + .002;
      const b = vlin(P0(s), dir, .0032, f, 0, u, 0), e = vlin(P0(s - .006 * t), dir, .0032 + h, f, 0, u, 0);
      if (prevB) {
        pushV(prevB, nrm, col, 3, s); pushV(b, nrm, col, 3, s); pushV(e, nrm, col, 3, s);
        pushV(prevB, nrm, col, 3, s); pushV(e, nrm, col, 3, s); pushV(prevE, nrm, col, 3, s);
      }
      prevB = b; prevE = e;
    }
  }
}

function buildBow(G, f, face, d, showArrow, nockOff) {
  // limb axis perpendicular to the arrow; bow plane turned to face the viewer so its curve reads
  let a = vnorm(vcross(face, f)); if (a[1] < 0) a = vmul(a, -1);
  const n = vnorm(vcross(f, a));
  const P = (x, z, y = 0) => vlin(G, a, x, f, -z, n, y);
  // riser / grip
  {
    const C = [], ra = [], rb = [], col = [], aux = [];
    for (let i = 0; i <= 16; i++) {
      const x = -.12 + .24 * i / 16, g = Math.exp(-Math.pow(x / .05, 2));
      C.push(P(x, .012 * g)); ra.push(.0095 + .002 * g); rb.push(.012 + .006 * g);
      const band = Math.abs(Math.abs(x) - .055) < .006;
      col.push(band ? IVORY_D : Math.abs(x) < .05 ? WRAP : IVORY); aux.push(x);
    }
    const [A, B] = frames(C, n);
    tube(C, A, B, ra, rb, col, 6, 10, aux);
  }
  // limbs: bend back towards the archer, tips curl forward (S-curve)
  const tips = [];
  for (const sg of [-1, 1]) {
    const C = [], ra = [], rb = [], col = [], aux = [];
    const K = 26;
    for (let i = 0; i <= K; i++) {
      const t = i / K;
      const x = sg * (.115 + .27 * t * (1 - .05 * d * t));
      const rec = Math.pow(smooth(.62, 1, t), 1.6);
      const z = (.075 + .05 * d) * Math.pow(t, 1.6) - .1 * rec * (1 - .35 * d);
      C.push(P(x, z)); ra.push(lerp(.0105, .005, t)); rb.push(lerp(.0062, .0036, t));
      col.push(IVORY); aux.push(t + (sg > 0 ? 2 : 0));
    }
    const [A, B] = frames(C, n);
    tube(C, A, B, ra, rb, col, 6, 8, aux);
    tips.push(C[K - 1]);
    // dark feather tufts at the string notch
    const base = C[K - 2], out = vnorm(vsub(C[K], C[K - 3]));
    for (let k = 0; k < 5; k++) {
      const ang = k / 5 * TAU;
      const dir = vnorm(vlin(vmul(out, .3), n, Math.cos(ang) * .9, f, Math.sin(ang) * .6 - .4, a, 0));
      const tipP = vlin(base, dir, .028 + .008 * (k % 2), [0, 0, 0], 0, [0, 0, 0], 0);
      const T = vnorm(vsub(tipP, base)), A2 = vnorm(vcross(T, f)), B2 = vnorm(vcross(T, A2));
      tube([base, vlin(base, dir, .012, [0, 0, 0], 0, [0, 0, 0], 0), tipP], [A2, A2, A2], [B2, B2, B2], [.0035, .003, .0002], [.0012, .001, .0002], TUFT, 3, 4, [0, 0, 0]);
    }
  }
  // string
  const nock = P(0, BRACE + d * DRAW_LEN + nockOff, .018);
  for (const tp of tips) {
    const T = vnorm(vsub(nock, tp)), A = vnorm(vcross(T, n)), B = vnorm(vcross(T, A));
    tube([tp, nock], [A, A], [B, B], [.0009, .0009], [.0009, .0009], STRING, 2, 6, [0, 0]);
  }
  { // serving around the nocking point
    const C = [P(0, BRACE + d * DRAW_LEN + nockOff, .006), P(0, BRACE + d * DRAW_LEN + nockOff, .03)];
    tube(C, [a, a], [f, f], [.0013, .0013], [.0013, .0013], IVORY_D, 2, 6, [0, 0]);
  }
  if (showArrow > 0) buildArrow(vlin(nock, f, (1 - showArrow) * -.25, [0, 0, 0], 0, [0, 0, 0], 0), f, n);
  return { nock, n };
}

const proj = p => [W / 2 + p[0] / p[2] * F, H / 2 - p[1] / p[2] * F];
const rayTo = (x, y) => vnorm([(x - W / 2) / F, -(y - H / 2) / F, 1]);
function bowAim(G, x, y) {
  const sp = vmul(rayTo(x, y), 3.2);                 // the star, seen along its ray
  const f = vnorm(vsub(sp, G));
  const v = vnorm(G), dv = v[0] * f[0] + v[1] * f[1] + v[2] * f[2];
  const face = vnorm(vsub(v, vmul(f, dv)));
  return { f, face };
}
function gripPos() {
  const z = 1.75, yScreen = H - Math.min(W, H) * .25;
  return [0, -(yScreen - H / 2) / F * z, z];
}

/* ---------------- aiming ---------------- */
const aim = { x: innerWidth / 2, y: innerHeight * .35, down: false, seen: false, id: -1 };
let target = -1, lockT = 9, zoom = 1, flashAmt = 0;
const ret = { x: aim.x, y: aim.y, a: 0, s: 1, lock: 0, col: [1, 1, 1], style: 0 };
let draw = 0, vib = 0, vibV = 0, kick = 0, kickV = 0, nock = 1, nockWait = 0;
let aimX = innerWidth / 2, aimY = innerHeight * .4;
const arrows = [];
const claimed = new Set();
let meteorT = 3;
const retR = () => clamp(Math.min(W, H) * .042, 28, 40);

function findTarget() {
  const R = retR() * 1.05;
  let best = -1, bs = 1e9;
  for (let i = 0; i < N; i++) {
    if (alive[i] < .6 || claimed.has(i)) continue;
    const dx = sx(i) - aim.x, dy = sy(i) - aim.y, d2 = dx * dx + dy * dy;
    const lim = i === target ? R * 1.3 : R;
    if (d2 > lim * lim) continue;
    if (sy(i) > horizonY(sx(i)) - 8) continue;
    const sc = Math.sqrt(d2) - 30 * starMag[i] - (i === target ? 14 : 0);
    if (sc < bs) { bs = sc; best = i; }
  }
  if (best !== target) {
    target = best; lockT = 0;
    if (best >= 0) { zoom = 1; ret.col = [starA[best * 8 + 4], starA[best * 8 + 5], starA[best * 8 + 6]]; ret.style = starStyle[best]; }
  }
}
function release() {
  aim.down = false;
  if (draw > .22 && nock > .9) {
    const tx = target >= 0 ? sx(target) : aim.x, ty = target >= 0 ? sy(target) : Math.min(aim.y, H * .8);
    const G = gripPos(), { f: fb, face } = bowAim(G, tx, ty);
    let ax = vnorm(vcross(face, fb)); if (ax[1] < 0) ax = vmul(ax, -1);
    const nb = vnorm(vcross(fb, ax));
    const Nk = vlin(G, fb, -(BRACE + draw * DRAW_LEN), nb, .018, [0, 0, 0], 0);
    const far = vmul(rayTo(tx, ty), 40), f = vnorm(vsub(far, Nk)), flen = Math.hypot(far[0] - Nk[0], far[1] - Nk[1], far[2] - Nk[2]);
    if (target >= 0) claimed.add(target);
    arrows.push({ N0: Nk, f, flen, t: 0, dur: .5 + .15 * (1 - draw), idx: target, px: null, py: null, tx, ty, up: [0, 1, 0] });
    vib = draw; vibV = 0; kickV = 1.4 * draw; nock = 0; nockWait = .45;
  }
  draw = 0;
  target = -1;
}
ui.addEventListener('pointerdown', e => {
  if (aim.down) return;
  aim.down = true; aim.id = e.pointerId; aim.seen = e.pointerType === 'mouse'; aim.x = e.clientX; aim.y = e.clientY;
  try { ui.setPointerCapture(e.pointerId); } catch (_) {}
  if (target < 0) { ret.x = aim.x; ret.y = aim.y; }
  findTarget();
});
ui.addEventListener('pointermove', e => {
  aim.x = e.clientX; aim.y = e.clientY; aim.seen = e.pointerType === 'mouse';
  if (aim.down ? e.pointerId === aim.id : aim.seen) findTarget();
});
ui.addEventListener('pointerup', e => { if (aim.down && e.pointerId === aim.id) { release(); if (aim.seen) findTarget(); } });
ui.addEventListener('pointercancel', e => { if (aim.down && e.pointerId === aim.id) { aim.down = false; draw = 0; target = -1; } });
ui.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !aim.down) { aim.seen = false; target = -1; } });

/* ---------------- 2D overlay ---------------- */
const rgba = (c, a) => `rgba(${c[0] * 255 | 0},${c[1] * 255 | 0},${c[2] * 255 | 0},${a})`;
function drawReticle() {
  if (ret.a < .01) return;
  const R = retR() * ret.s, a = ret.a, lk = ret.lock;
  const tc = [lerp(.9, ret.col[0], .6 * lk), lerp(.94, ret.col[1], .6 * lk), lerp(1, ret.col[2], .6 * lk)];
  cx.save(); cx.translate(ret.x, ret.y);
  // one thin ring: dashed while searching, solid and tinted once locked
  cx.strokeStyle = rgba(tc, (.3 + .5 * lk) * a); cx.lineWidth = 1 + .4 * lk;
  if (lk < .5) { cx.setLineDash([3, 5]); cx.lineDashOffset = -time * 10; }
  cx.beginPath(); cx.arc(0, 0, R, 0, TAU); cx.stroke();
  cx.setLineDash([]);
  // four short ticks that close in when locked
  if (lk > .01) {
    cx.strokeStyle = rgba(tc, .85 * a * lk); cx.lineWidth = 1.2;
    const r0 = R + 3 + (1 - lk) * 8, r1 = r0 + 5;
    for (let k = 0; k < 4; k++) {
      const an = k * Math.PI / 2, c = Math.cos(an), s = Math.sin(an);
      cx.beginPath(); cx.moveTo(c * r0, s * r0); cx.lineTo(c * r1, s * r1); cx.stroke();
    }
  }
  cx.restore();
}
function drawCursor() {
  if (aim.down || !aim.seen || ret.lock > .5) return;
  cx.strokeStyle = 'rgba(225,235,255,.55)'; cx.lineWidth = 1;
  cx.beginPath(); cx.arc(aim.x, aim.y, 7, 0, TAU); cx.stroke();
  cx.fillStyle = 'rgba(225,235,255,.85)';
  cx.beginPath(); cx.arc(aim.x, aim.y, 1.3, 0, TAU); cx.fill();
}

/* ---------------- frame ---------------- */
const Lbuf = new Float32Array(16), LCbuf = new Float32Array(12);
let last = performance.now();
function drawParticles(fgPass) {
  const n = writeParticles(fgPass, 0);
  if (!n) return;
  gl.useProgram(partProg); gl.uniform2f(partProg.u.uRes, W, H);
  gl.bindBuffer(gl.ARRAY_BUFFER, partBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pdata, 0, n * FL);
  gl.bindVertexArray(partVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, n);
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(Math.max((now - last) / 1000, 1e-3), .05); last = now;
  time += dt;

  // drawing the bow
  if (aim.down) draw += (1 - draw) * Math.min(1, dt * 3.2);
  vibV += (-vib * 520 - vibV * 9) * dt; vib += vibV * dt;
  kickV += (-kick * 160 - kickV * 14) * dt; kick += kickV * dt;
  if (nockWait > 0) nockWait -= dt; else nock = Math.min(1, nock + dt * 2.6);

  // aim point (bow follows the cursor, snaps to a locked star)
  const lockedNow = target >= 0 && (aim.down || aim.seen);
  const wantX = lockedNow ? sx(target) : aim.x, wantY = Math.min(lockedNow ? sy(target) : aim.y, H * .8);
  const ak = Math.min(1, dt * (aim.down ? 14 : 6));
  aimX += (wantX - aimX) * ak; aimY += (wantY - aimY) * ak;

  // lock-on: magnify + a single shine
  lockT += dt;
  zoom += ((lockedNow ? 1.6 : 1) - zoom) * Math.min(1, dt * 9);
  flashAmt = target >= 0 && lockT < .7 ? Math.sin(Math.PI * lockT / .7) : 0;
  const rdx = lockedNow ? sx(target) : aim.x, rdy = lockedNow ? sy(target) : aim.y;
  const rk = Math.min(1, dt * 26);
  ret.x += (rdx - ret.x) * rk; ret.y += (rdy - ret.y) * rk;
  const showRet = aim.down || lockedNow;
  ret.a += ((showRet ? 1 : 0) - ret.a) * Math.min(1, dt * (showRet ? 10 : 6));
  ret.lock += ((lockedNow ? 1 : 0) - ret.lock) * Math.min(1, dt * 12);
  const sTarget = !showRet ? .7 : lockedNow ? (lockT < .2 ? 1.25 - lockT * 1.25 : 1) : .85;
  ret.s += (sTarget - ret.s) * Math.min(1, dt * 14);

  // arrows in flight (true 3D: they shrink into the sky)
  for (let i = arrows.length - 1; i >= 0; i--) {
    const A = arrows[i];
    A.t += dt / A.dur;
    const s = (A.flen - ARROW_LEN) * Math.pow(Math.min(A.t, 1), 1.15);
    const tip = vlin(A.N0, A.f, s + ARROW_LEN, [0, 0, 0], 0, [0, 0, 0], 0);
    const [qx, qy] = proj(tip);
    if (A.px !== null) {
      for (let k = 0; k < 3; k++) {
        const fr = k / 3;
        add({ x: lerp(A.px, qx, fr), y: lerp(A.py, qy, fr), vx: (rnd() - .5) * 10, vy: (rnd() - .5) * 10, drag: 3, gr: 30, life: .35 + rnd() * .35,
          shape: 0, sz: 1.2 + rnd(), col: WARMW, I: .55, tw: .4, fo: 1.5 });
      }
    }
    A.px = qx; A.py = qy; A.s = s;
    if (A.t >= 1) {
      arrows.splice(i, 1); claimed.delete(A.idx);
      if (A.idx >= 0 && alive[A.idx] > .5) {
        const j = A.idx;
        alive[j] = 0; respawnAt[j] = time + 22 + rnd() * 20; dead.push(j);
        explode(sx(j), sy(j), starStyle[j], starMag[j]);
      } else {
        add({ x: qx, y: qy, shape: 1, sz: 5, life: .4, gr: 0, col: WARMW, I: 1, fo: 1 });
      }
    }
  }

  for (let k = dead.length - 1; k >= 0; k--) {
    const j = dead[k];
    if (time > respawnAt[j]) { alive[j] = Math.min(1, alive[j] + dt / 3); if (alive[j] >= 1) dead.splice(k, 1); }
  }

  meteorT -= dt;
  if (meteorT <= 0) {
    meteorT = 5 + rnd() * 9;
    const x = W * (.2 + rnd() * .9), y = H * (rnd() * .3), a = Math.PI * (.72 + rnd() * .12), sp = 650 + rnd() * 450;
    add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: .4, gr: 0, life: .7 + rnd() * .5, shape: 8, sz: 1.2, str: .1,
      col: [.85, .9, 1], I: 1, fin: .12, fo: 2, trail: 70, tc: [.7, .8, 1] });
  }

  stepParticles(dt);
  for (const l of lightsArr) l.I *= Math.exp(-dt * 2.6);

  /* ---- GL ---- */
  gl.viewport(0, 0, glc.width, glc.height);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  for (let i = 0; i < 4; i++) {
    const l = lightsArr[i];
    Lbuf.set(l ? [l.x, l.y, l.r, l.I] : [0, 0, 1, 0], i * 4);
    LCbuf.set(l ? l.col : [0, 0, 0], i * 3);
  }
  gl.useProgram(skyProg);
  gl.uniform2f(skyProg.u.uRes, W, H); gl.uniform1f(skyProg.u.uDpr, DPR); gl.uniform1f(skyProg.u.uTime, time);
  gl.uniform4fv(skyProg.u.uL, Lbuf); gl.uniform3fv(skyProg.u.uLC, LCbuf);
  gl.uniform1i(skyProg.u.uMode, 0);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(starProg);
  gl.uniform2f(starProg.u.uRes, W, H); gl.uniform1f(starProg.u.uTime, time);
  gl.uniform1i(starProg.u.uTarget, lockedNow ? target : -1);
  gl.uniform1f(starProg.u.uZoom, zoom); gl.uniform1f(starProg.u.uFlash, flashAmt);
  gl.bindBuffer(gl.ARRAY_BUFFER, aliveBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, alive);
  gl.bindVertexArray(starVAO); gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);

  drawParticles(0);

  gl.useProgram(skyProg); gl.uniform1i(skyProg.u.uMode, 1);
  gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLES, 0, 3);

  drawParticles(1);

  // lens: magnified view of the locked star
  if (ret.a * ret.lock > .01) {
    gl.useProgram(lensProg);
    gl.uniform2f(lensProg.u.uRes, W, H); gl.uniform2f(lensProg.u.uC, ret.x, ret.y); gl.uniform1f(lensProg.u.uR, retR() * ret.s - 2);
    gl.uniform1i(lensProg.u.uStyle, ret.style); gl.uniform3f(lensProg.u.uCol, ret.col[0], ret.col[1], ret.col[2]);
    gl.uniform1f(lensProg.u.uT, time); gl.uniform1f(lensProg.u.uOn, ret.a * ret.lock); gl.uniform1f(lensProg.u.uFl, flashAmt);
    gl.bindVertexArray(quadVAO); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  // bow + arrows
  bn = 0;
  const G0 = gripPos();
  const { f, face } = bowAim(G0, aimX, aimY);
  const sway = aim.down ? .0025 * draw : .0015;
  const G = vadd(G0, [Math.sin(time * .9) * sway, Math.sin(time * 1.3 + 1) * sway + (aim.down ? .012 * draw : 0), kick * .03]);
  const dd = aim.down ? draw : vib;
  buildBow(G, f, face, Math.max(dd, -.15), nock, 0);
  for (const A of arrows) buildArrow(vlin(A.N0, A.f, A.s, [0, 0, 0], 0, [0, 0, 0], 0), A.f, [0, 1, 0]);
  if (bn) {
    gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.useProgram(bowProg);
    gl.uniform2f(bowProg.u.uRes, W, H); gl.uniform1f(bowProg.u.uF, F);
    let fl = null; for (const l of lightsArr) if (!fl || l.I > fl.I) fl = l;
    if (fl && fl.I > .02) {
      const d = rayTo(fl.x, fl.y);
      gl.uniform3f(bowProg.u.uFlDir, d[0], d[1], d[2]);
      gl.uniform3f(bowProg.u.uFlCol, fl.col[0] * fl.I * .9, fl.col[1] * fl.I * .9, fl.col[2] * fl.I * .9);
    } else { gl.uniform3f(bowProg.u.uFlDir, 0, 1, 0); gl.uniform3f(bowProg.u.uFlCol, 0, 0, 0); }
    gl.bindBuffer(gl.ARRAY_BUFFER, bowBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, bdata, 0, bn * BVF);
    gl.bindVertexArray(bowVAO); gl.drawArrays(gl.TRIANGLES, 0, bn);
    gl.disable(gl.DEPTH_TEST);
  }

  /* ---- 2D ---- */
  cx.clearRect(0, 0, W, H);
  drawReticle();
  drawCursor();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
